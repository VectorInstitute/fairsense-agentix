site_url: https://vectorinstitute.github.io/fairsense-agentix/
site_description: >-
  Open-source agentic platform for text and image bias detection, AI risk
  assessment, and NIST AI RMF–aligned deployment analysis from the Vector Institute.
copyright: Copyright &copy; Vector Institute
edit_uri: edit/main/docs/
exclude_docs: |
  blog-draft-joss-acceptance.md
  *.docx
extra_css:
  - stylesheets/extra.css
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VectorInstitute/fairsense-agentix
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fairsense-agentix/
markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Config & Troubleshooting: config_troubleshooting.md
  - User Guide: user_guide.md
  - Server Guide: server.md
  - Architecture: architecture.md
  - API Reference: api.md
  - Developer Guide: developers.md
  - Acknowledgments: acknowledgments.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            members_order: source
            separate_signature: true
            show_overloads: true
            show_submodules: true
            show_root_heading: false
            show_root_full_path: true
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
repo_url: https://github.com/VectorInstitute/fairsense-agentix
repo_name: VectorInstitute/fairsense-agentix
site_name: FairSense-AgentiX
theme:
  custom_dir: docs/overrides
  favicon: assets/favicon-48x48.svg
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/vector-logo.svg
  logo_footer: assets/vector-logo.svg
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: vector
      accent: vector-teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: vector-teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
